version: 2
# Minor and patch bumps are grouped into one PR per ecosystem; major bumps come as
# separate PRs so a breaking one can be fixed or closed without holding up the rest.
# Merge policy (see CLAUDE.md): merged when CI is green.
updates:
  # Python dependencies from pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  # Action versions in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]

  # azurerm / tls provider constraints in infra/
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    groups:
      terraform-minor-and-patch:
        update-types: [minor, patch]

  # Base image in the Dockerfile (pinned by digest): new digests for python:3.12-slim
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the Python minor version of the image; moving to a newer one is a deliberate change.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
