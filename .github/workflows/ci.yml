name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Audit exactly what the project installs (runtime + dev deps), not the runner's own pip/setuptools.
      # Fails the job on any known vulnerability (PyPI advisory database / OSV).
      - run: pip freeze --exclude-editable > audit-requirements.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r audit-requirements.txt --no-deps --disable-pip --progress-spinner off

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm derives the version from the latest tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The same build as release.yml, so a broken package shows up before a tag is pushed.
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      # The wheel alone, outside the source tree, must run the demo (KQL, templates and demo data included).
      - name: Demo from the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/waste-finder --version
          /tmp/wheel-env/bin/waste-finder --demo --format md,json --out-dir /tmp/wheel-demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built, not pushed: cd.yml pushes to GHCR after CI on main is green.
      - run: docker build --build-arg VERSION=0.0.0+ci --tag azure-waste-finder:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id azure-waste-finder:ci -u)" = "10001"
      - name: Demo in the container
        run: |
          docker run --rm azure-waste-finder:ci --version
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/home/finder/reports" azure-waste-finder:ci \
            --demo --format md,html,json
          test -s out/report.json && test -s out/report.html

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes the JUnit results as a check run
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The coverage floor (fail_under) lives in pyproject.toml.
      - run: pytest -q --cov --cov-report=term --cov-report=xml --cov-report=html --junitxml=junit.xml
      - name: Publish test results
        uses: dorny/test-reporter@v3
        # Dependabot and fork PRs get a read-only token and cannot create check runs.
        if: >-
          !cancelled() && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: pytest (Python ${{ matrix.python-version }})
          path: junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
      - name: Demo report
        if: matrix.python-version == '3.12'
        # All output formats; the short summary appears on the run's summary page.
        run: >-
          python -m waste_finder --demo --format md,html,json,csv,sarif --out-dir reports
          --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: reports/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # infra/tests/*.tftest.hcl, providers mocked: no Azure login, nothing is created
      - run: terraform test
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download from GitHub releases, avoids rate limits
      - run: tflint --format compact

  config-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.21
      # Report-only: findings go to the Security tab, the job does not fail on them.
      # Intentional findings (it is a waste environment) are skipped inline in infra/ with a reason.
      - run: >-
          checkov -d infra --framework terraform --soft-fail --compact
          -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        # Dependabot and fork PRs get a read-only token and cannot upload SARIF.
        if: >-
          !cancelled() && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: checkov.sarif
          category: checkov
