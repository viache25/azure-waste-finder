name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes the JUnit results as a check run
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The coverage floor (fail_under) lives in pyproject.toml.
      - run: pytest -q --cov --cov-report=term --cov-report=xml --cov-report=html --junitxml=junit.xml
      - name: Publish test results
        uses: dorny/test-reporter@v3
        # Dependabot and fork PRs get a read-only token and cannot create check runs.
        if: >-
          !cancelled() && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: pytest (Python ${{ matrix.python-version }})
          path: junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
      - name: Demo report
        if: matrix.python-version == '3.12'
        run: python -m waste_finder --demo --out-dir reports
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: reports/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # infra/tests/*.tftest.hcl, providers mocked: no Azure login, nothing is created
      - run: terraform test
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download from GitHub releases, avoids rate limits
      - run: tflint --format compact

  config-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.21
      # Report-only: findings go to the Security tab, the job does not fail on them.
      # Intentional findings (it is a waste environment) are skipped inline in infra/ with a reason.
      - run: >-
          checkov -d infra --framework terraform --soft-fail --compact
          -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        # Dependabot and fork PRs get a read-only token and cannot upload SARIF.
        if: >-
          !cancelled() && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: checkov.sarif
          category: checkov
