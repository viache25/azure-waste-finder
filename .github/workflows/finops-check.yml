name: FinOps check

# Weekly and manual scan of the real subscription (D2): logs in with OIDC as the identity from infra/github-oidc
# (Reader + Cost Management Reader, no secret), writes the report (md, html, json) as artifact `finops-report`,
# compares it with the previous run's report.json (trend) and keeps one issue "Azure waste report" up to date:
# opened or updated above the threshold, closed when no waste is left (scripts/finops_issue.py).
# Read-only, creates nothing in Azure, so it may run on a schedule (D3).
# Until the repository variable AZURE_CLIENT_ID is set (README "Connect GitHub to Azure"), the job is skipped
# and the run stays green.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: Open or update the issue above this monthly amount (empty = variable FINOPS_ISSUE_THRESHOLD, else 10)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: finops-check
  cancel-in-progress: false

jobs:
  check:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login (federated credential for refs/heads/main)
      issues: write # open, update or close the "Azure waste report" issue
      actions: read # find and download the previous run's report artifact
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      COST_SOURCE: ${{ vars.FINOPS_COST_SOURCE || 'retail' }}
      THRESHOLD: ${{ inputs.threshold || vars.FINOPS_ISSUE_THRESHOLD || '10' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      # DefaultAzureCredential picks up this Azure CLI login.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Previous report
        id: previous
        # Newest unexpired finops-report artifact from main; none on the first run or after 90 days without a run.
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=finops-report&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name finops-report --dir previous \
            && [ -s previous/report.json ]; then
            echo "Comparing with the report of run $run_id"
            echo "path=previous/report.json" >> "$GITHUB_OUTPUT"
          else
            echo "No previous report: this run has no trend."
          fi
      - name: Waste finder
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
        run: |
          args=(--subscription "$AZURE_SUBSCRIPTION_ID" --cost-source "$COST_SOURCE" --format md,html,json --out-dir reports)
          if [ -n "$PREVIOUS" ]; then
            rc=0
            waste-finder "${args[@]}" --previous "$PREVIOUS" --summary "$GITHUB_STEP_SUMMARY" || rc=$?
            # Exit code 2 = usage error, e.g. a previous report in another currency: run once more without the trend.
            if [ "$rc" -ne 2 ]; then exit "$rc"; fi
            echo "::warning::previous report not usable, running without the trend"
          fi
          waste-finder "${args[@]}" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: finops-report
          path: reports/
          retention-days: 90
          if-no-files-found: error
      - name: Issue "Azure waste report"
        run: >-
          python scripts/finops_issue.py --report reports/report.json --threshold "$THRESHOLD"
          --repo "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
