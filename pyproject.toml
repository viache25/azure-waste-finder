[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-waste-finder"
version = "0.1.0"
description = "Find wasted spend in an Azure subscription and estimate its monthly cost"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-resourcegraph>=8.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
waste-finder = "waste_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waste_finder = ["queries/*.kql", "templates/*", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
