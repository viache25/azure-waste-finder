[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-waste-finder"
version = "0.1.0"
description = "Find wasted spend in an Azure subscription and estimate its monthly cost"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-resourcegraph>=8.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
    "jsonschema>=4.23",
]

[project.scripts]
waste-finder = "waste_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waste_finder = ["queries/*.kql", "templates/*", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["waste_finder"]
branch = true

[tool.coverage.report]
# Measured 98.9 % when this was added; floor = measured rounded down to 5, never below 80.
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# The price notes show "0.0112 €/h × 730 h" on purpose.
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
